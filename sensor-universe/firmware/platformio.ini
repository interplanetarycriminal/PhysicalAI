; ============================================================================
;  sensor-universe / firmware — the first firmware for the ESP32 Sensor
;  Universe atlas.
;
;  Three fusion edges from sensor-universe/data/fusion.py, each with its own
;  example, each built for both target boards, plus one host-side environment
;  that compiles the shared physics and runs known-answer tests against it.
;
;    condensation-watch  SHT41 (0x44) + MLX90614 (0x5A)  -> dew point, margin
;    ach-co2-decay       SCD41 (0x62)                    -> air changes / hour
;    air-density-live    BME280 (0x76)                   -> rho, kg/m3
;
;  Every library below is pinned to an exact version whose library.properties
;  was read from the vendor's own repository. Nothing here is a guess.
;
;    adafruit/Adafruit SHT4x Library    1.0.5
;      github.com/adafruit/Adafruit_SHT4X
;    adafruit/Adafruit MLX90614 Library 2.1.6
;      github.com/adafruit/Adafruit-MLX90614-Library
;    adafruit/Adafruit BME280 Library   2.3.0
;      github.com/adafruit/Adafruit_BME280_Library
;    sensirion/Sensirion I2C SCD4x      1.1.0
;      github.com/Sensirion/arduino-i2c-scd4x
;
;  Adafruit BusIO, Adafruit Unified Sensor and Sensirion Core arrive as the
;  declared transitive dependencies of those four and are deliberately not
;  listed. (Adafruit's SHT4x library also declares Adafruit SH110X and
;  Adafruit SSD1306 — display libraries its examples use. They are fetched and
;  never compiled into this firmware.)
;
;  The platform is pinned to an exact release rather than floating, so that a
;  build a year from now is the build of today.
;
;  https://docs.platformio.org/page/projectconf.html
; ============================================================================

[platformio]
default_envs =
    condensation-s3
    condensation-esp32
    ach-s3
    ach-esp32
    airdensity-s3
    airdensity-esp32

; ---------------------------------------------------------------------------
; Shared by every environment, host build included.
; physlib.h is header-only and hardware-free, so the host test compiles the
; same header the ESP32 examples do.
; ---------------------------------------------------------------------------
[env]
build_flags = -I "$PROJECT_DIR/physlib"
build_src_flags = -Wall -Wextra

; ---------------------------------------------------------------------------
; Shared by the six embedded environments only.
; ---------------------------------------------------------------------------
[embedded]
platform = espressif32 @ 6.13.0
framework = arduino
monitor_speed = 115200
; Every example compiles exactly one .cpp from src/ plus the shared header.
build_src_filter = -<*>

; ===========================================================================
; Edge 1 — condensation-watch
; ===========================================================================
[condensation]
extends = embedded
build_src_filter = -<*> +<condensation_watch.cpp>
lib_deps =
    adafruit/Adafruit SHT4x Library @ 1.0.5
    adafruit/Adafruit MLX90614 Library @ 2.1.6

[env:condensation-s3]
extends = condensation
board = esp32-s3-devkitc-1

[env:condensation-esp32]
extends = condensation
board = esp32dev

; ===========================================================================
; Edge 2 — ach-co2-decay
; ===========================================================================
[ach]
extends = embedded
build_src_filter = -<*> +<ach_co2_decay.cpp>
lib_deps =
    sensirion/Sensirion I2C SCD4x @ 1.1.0

[env:ach-s3]
extends = ach
board = esp32-s3-devkitc-1

[env:ach-esp32]
extends = ach
board = esp32dev

; ===========================================================================
; Edge 3 — air-density-live
; ===========================================================================
[airdensity]
extends = embedded
build_src_filter = -<*> +<air_density_live.cpp>
lib_deps =
    adafruit/Adafruit BME280 Library @ 2.3.0

[env:airdensity-s3]
extends = airdensity
board = esp32-s3-devkitc-1

[env:airdensity-esp32]
extends = airdensity
board = esp32dev

; ===========================================================================
; Host-side tests — no board, no Arduino, no Wire.
;   pio test -e native
; test_build_src stays at its default (false), so nothing from src/ is
; compiled here: the host build sees physlib.h and the test file, nothing more.
; ===========================================================================
[env:native]
platform = native
test_framework = unity
